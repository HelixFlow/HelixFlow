services:
  mysql:
    image: mysql:8.0
    container_name: helixflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123123"
      MYSQL_DATABASE: helix
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "13306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - helixflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123123"]
      interval: 5s
      timeout: 3s
      retries: 20

  helixflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helixflow-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_TABLE_HOST: mysql
      APP_TABLE_PORT: "3306"
      APP_TABLE_USERNAME: root
      APP_TABLE_PASSWORD: "123123"
    ports:
      - "11110:11110"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:11110/helixflow/health',timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  helixflow_mysql_data:
